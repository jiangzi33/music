<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Music</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f7fafc;
            transition: border-color 0.15s, background 0.15s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, opacity 0.15s;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover { text-decoration: underline; }
        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }
        .alert.error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        .alert.success {
            background: #f0fff4;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to keep listening.</p>

    <div id="alert" class="alert"></div>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="name">Username</label>
            <input type="text" id="name" name="name" placeholder="Your username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required>
        </div>

        <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <p class="footer">New here? <a href="/register.html">Create an account</a></p>
</div>

<script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');
    const nameInput = document.getElementById('name');

    const params = new URLSearchParams(window.location.search);
    const prefillName = params.get('name');
    if (prefillName) {
        nameInput.value = prefillName;
    }

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = 'alert ' + type;
        alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const name = nameInput.value.trim();
        const password = document.getElementById('password').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
            const query = 'name=' + encodeURIComponent(name) + '&password=' + encodeURIComponent(password);
            const res = await fetch('/user/login?' + query, {
                method: 'GET'
            });
            const data = await res.json();

            if (data.code === 200 && data.success) {
                showAlert('Signed in! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/music.html?name=' + encodeURIComponent(name);
                }, 800);
            } else {
                showAlert(data.message || 'Sign in failed. Please try again.', 'error');
            }
        } catch (err) {
            showAlert('Network error. Please check your connection and try again.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
