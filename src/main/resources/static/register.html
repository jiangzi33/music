<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Music</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 460px;
        }
        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #718096;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f7fafc;
            transition: border-color 0.15s, background 0.15s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row > .field {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, opacity 0.15s;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover { text-decoration: underline; }
        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }
        .alert.error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        .alert.success {
            background: #f0fff4;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }
        .hint {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Join Music and discover sounds you'll love.</p>

    <div id="alert" class="alert"></div>

    <form id="registerForm" novalidate>
        <div class="field">
            <label for="name">Username</label>
            <input type="text" id="name" name="name" placeholder="Choose a username" required minlength="3" maxlength="32">
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="row">
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
            </div>
            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 25" required>
            </div>
        </div>

        <div class="field">
            <label for="interests">Musical interests</label>
            <input type="text" id="interests" name="interests" placeholder="e.g. Pop, Jazz, Classical">
            <div class="hint">Separate multiple genres with commas.</div>
        </div>

        <button type="submit" id="submitBtn">Sign Up</button>
    </form>

    <p class="footer">Already have an account? <a href="/login.html">Sign in</a></p>
</div>

<script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = 'alert ' + type;
        alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const payload = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            age: parseInt(document.getElementById('age').value, 10),
            interests: document.getElementById('interests').value.trim()
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        try {
            const res = await fetch('/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.code === 200 && data.success) {
                showAlert('Account created! Please check your email to activate your account.', 'success');
                form.reset();
            } else {
                showAlert(data.message || 'Registration failed. Please try again.', 'error');
            }
        } catch (err) {
            showAlert('Network error. Please check your connection and try again.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
        }
    });
</script>
</body>
</html>
