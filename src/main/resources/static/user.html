<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header .user {
            font-size: 14px;
            opacity: 0.9;
        }
        .header .user a {
            color: #fff;
            margin-left: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 32px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #718096;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .search-row {
            display: flex;
            gap: 10px;
        }
        input, select {
            flex: 1;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f7fafc;
            transition: border-color 0.15s, background 0.15s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }
        button {
            padding: 11px 22px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }
        .alert.error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        .alert.info {
            background: #ebf8ff;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }
        .result {
            margin-top: 20px;
            display: none;
        }
        .result-title {
            font-size: 22px;
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .result-author {
            font-size: 14px;
            color: #718096;
            margin-bottom: 16px;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 24px;
            margin-bottom: 16px;
        }
        .meta-item {
            font-size: 13px;
        }
        .meta-label {
            color: #a0aec0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .meta-value {
            color: #2d3748;
        }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            font-size: 12px;
            color: #667eea;
            background: #ebf4ff;
            border-radius: 12px;
            margin-right: 6px;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 12px;
        }
        .badge.NORMAL { color: #276749; background: #c6f6d5; }
        .badge.INIT { color: #975a16; background: #fefcbf; }
        .badge.ABNORMAL { color: #c53030; background: #fed7d7; }
        .list { margin-top: 20px; }
        .list-item {
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: border-color 0.15s, transform 0.1s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .list-item:hover {
            border-color: #667eea;
            transform: translateY(-1px);
        }
        .list-item-title {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 2px;
        }
        .list-item-meta {
            font-size: 12px;
            color: #718096;
        }
        .list-item-body { flex: 1; min-width: 0; }
        .list-item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .list-item-thumb {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
        }
        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }
        .pager .info {
            font-size: 13px;
            color: #718096;
        }
        .pager .nav {
            display: flex;
            gap: 8px;
        }
        .pager button {
            padding: 8px 16px;
            font-size: 13px;
        }
        .empty {
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
            padding: 24px 0;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .btn-secondary {
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
        }
        .btn-secondary:hover { transform: translateY(-1px); }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            padding: 28px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-header h3 {
            font-size: 18px;
            color: #2d3748;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: #a0aec0;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
        }
        .modal-close:hover { color: #2d3748; transform: none; }
        .modal .field { margin-bottom: 14px; }
        .modal label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .modal input, .modal select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f7fafc;
            font-family: inherit;
        }
        .modal input:focus, .modal select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        .btn-cancel {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            background: #edf2f7;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-cancel:hover { background: #e2e8f0; transform: none; }
        .btn-icon {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .btn-icon.edit { color: #667eea; }
        .btn-icon.edit:hover { background: #ebf4ff; border-color: #667eea; }
        .btn-icon.delete { color: #c53030; }
        .btn-icon.delete:hover { background: #fff5f5; border-color: #fc8181; }
        .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-readonly {
            background: #edf2f7 !important;
            color: #718096;
            cursor: not-allowed;
        }
        .btn-icon.tags { color: #38a169; }
        .btn-icon.tags:hover { background: #f0fff4; border-color: #68d391; }
        .btn-icon.records { color: #dd6b20; }
        .btn-icon.records:hover { background: #fffaf0; border-color: #f6ad55; }
        .records-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .range-preset {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #dd6b20;
            background: #fffaf0;
            border: 1px solid #f6ad55;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .range-preset:hover { background: #dd6b20; color: #fff; border-color: #dd6b20; }
        .range-preset.active { background: #dd6b20; color: #fff; border-color: #dd6b20; }
        .records-filter {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 16px;
        }
        .records-filter .field {
            flex: 1;
            margin-bottom: 0;
        }
        .records-filter button {
            padding: 10px 18px;
            font-size: 13px;
            flex-shrink: 0;
        }
        .record-item {
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .record-item .record-title {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
        }
        .record-item .record-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 16px;
            font-size: 12px;
            color: #718096;
        }
        .tag-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f7fafc;
            margin-bottom: 12px;
        }
        .tag-chips:empty::before {
            content: "No tags yet — add some below.";
            color: #a0aec0;
            font-size: 13px;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px 4px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 14px;
        }
        .tag-chip .x {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }
        .tag-chip .x:hover { background: rgba(255, 255, 255, 0.45); }
        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .preset-tag {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            background: #ebf4ff;
            border: 1px solid #c3dafe;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .preset-tag:hover { background: #667eea; color: #fff; border-color: #667eea; }
        .preset-tag.added {
            opacity: 0.45;
            cursor: default;
            pointer-events: none;
        }
        .tag-input-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>User Management</h1>
        <div class="user">
            <span id="welcome"></span>
            <a id="coinBtn">Prize Management</a>
            <a id="musicBtn">Music Management</a>
            <a id="logoutBtn">Sign out</a>
        </div>
    </div>

    <div class="card">
        <div class="toolbar">
            <h2 style="margin-bottom:0;">Manage users</h2>
            <button type="button" class="btn-secondary" id="openAddBtn">+ Add User</button>
        </div>

        <div class="tabs">
            <div class="tab active" data-mode="name">By Name</div>
            <div class="tab" data-mode="id">By ID</div>
        </div>

        <form id="searchForm">
            <div class="search-row">
                <input type="text" id="query" placeholder="Enter a username (leave blank to browse all)">
                <button type="submit" id="searchBtn">Search</button>
            </div>
        </form>

        <div id="alert" class="alert"></div>

        <div id="list" class="list"></div>
        <div id="pager" class="pager" style="display:none;">
            <div class="info" id="pagerInfo"></div>
            <div class="nav">
                <button type="button" id="prevBtn">Prev</button>
                <button type="button" id="nextBtn">Next</button>
            </div>
        </div>

    </div>
</div>

<div class="modal-backdrop" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Edit user</h3>
            <button type="button" class="modal-close" id="closeEditBtn" aria-label="Close">&times;</button>
        </div>
        <div id="editAlert" class="alert" style="margin-top:0;"></div>
        <form id="editForm" novalidate>
            <div class="field">
                <label for="editName">Name</label>
                <input type="text" id="editName" class="input-readonly" readonly>
                <div class="hint" style="font-size:11px; color:#a0aec0; margin-top:4px;">Name is the lookup key and cannot be changed.</div>
            </div>
            <div class="field">
                <label for="editEmail">Email</label>
                <input type="email" id="editEmail" maxlength="255">
            </div>
            <div class="field">
                <label for="editAge">Age</label>
                <input type="number" id="editAge" min="0" max="200">
            </div>
            <div class="field">
                <label for="editStatus">Status</label>
                <select id="editStatus">
                    <option value="INIT">INIT</option>
                    <option value="NORMAL">NORMAL</option>
                    <option value="ABNORMAL">ABNORMAL</option>
                </select>
            </div>
            <div class="field">
                <label for="editInterests">Interests</label>
                <input type="text" id="editInterests" placeholder="e.g. Pop, Jazz">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelEditBtn">Cancel</button>
                <button type="submit" id="submitEditBtn">Save changes</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-backdrop" id="tagsModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="tagsTitle">Manage interest tags</h3>
            <button type="button" class="modal-close" id="closeTagsBtn" aria-label="Close">&times;</button>
        </div>
        <div id="tagsAlert" class="alert" style="margin-top:0;"></div>

        <label style="display:block; font-size:13px; font-weight:600; color:#4a5568; margin-bottom:6px;">Current tags</label>
        <div id="tagChips" class="tag-chips"></div>

        <label style="display:block; font-size:13px; font-weight:600; color:#4a5568; margin-bottom:6px;">Quick add</label>
        <div id="presetRow" class="preset-row"></div>

        <label for="tagInput" style="display:block; font-size:13px; font-weight:600; color:#4a5568; margin-bottom:6px;">Add a custom tag</label>
        <div class="tag-input-row">
            <input type="text" id="tagInput" placeholder="Type a tag and press Enter">
            <button type="button" id="addTagBtn">Add</button>
        </div>

        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelTagsBtn">Cancel</button>
            <button type="button" id="saveTagsBtn">Save tags</button>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="detailModal">
    <div class="modal">
        <div class="modal-header">
            <div style="display:flex; align-items:center; gap:14px; min-width:0;">
                <div class="list-item-thumb" id="dThumb" style="width:52px; height:52px; font-size:20px;"></div>
                <div style="min-width:0;">
                    <h3 id="dName" class="result-title" style="margin-bottom:2px;"></h3>
                    <div id="dEmail" class="result-author" style="margin-bottom:0;"></div>
                </div>
            </div>
            <button type="button" class="modal-close" id="closeDetailBtn" aria-label="Close">&times;</button>
        </div>

        <div class="meta-grid">
            <div class="meta-item">
                <div class="meta-label">ID</div>
                <div class="meta-value" id="dId"></div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Status</div>
                <div class="meta-value" id="dStatus"></div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Age</div>
                <div class="meta-value" id="dAge"></div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Registered</div>
                <div class="meta-value" id="dRegister"></div>
            </div>
        </div>

        <div class="meta-label" style="margin-bottom: 6px;">Interests</div>
        <div class="meta-value" id="dInterests"></div>

        <div class="modal-actions">
            <button type="button" class="btn-icon tags" id="detailTagsBtn">Manage tags</button>
            <button type="button" class="btn-icon edit" id="detailEditBtn">Edit</button>
            <button type="button" class="btn-cancel" id="cancelDetailBtn">Close</button>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="recordsModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="recordsTitle">Play records</h3>
            <button type="button" class="modal-close" id="closeRecordsBtn" aria-label="Close">&times;</button>
        </div>
        <div id="recordsAlert" class="alert" style="margin-top:0;"></div>

        <div class="records-presets" id="recordsPresets">
            <button type="button" class="range-preset" data-range="today">Today</button>
            <button type="button" class="range-preset" data-range="7d">Last 7 days</button>
            <button type="button" class="range-preset" data-range="30d">Last 30 days</button>
            <button type="button" class="range-preset" data-range="all">All time</button>
        </div>

        <div class="records-filter">
            <div class="field">
                <label for="recordsStart">Start time</label>
                <input type="datetime-local" id="recordsStart" step="1">
            </div>
            <div class="field">
                <label for="recordsEnd">End time</label>
                <input type="datetime-local" id="recordsEnd" step="1">
            </div>
            <button type="button" id="recordsApplyBtn">Apply</button>
        </div>

        <div id="recordsList"></div>

        <div id="recordsPager" class="pager" style="display:none;">
            <div class="info" id="recordsPagerInfo"></div>
            <div class="nav">
                <button type="button" id="recordsPrevBtn">Prev</button>
                <button type="button" id="recordsNextBtn">Next</button>
            </div>
        </div>

        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelRecordsBtn">Close</button>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="addModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Add a new user</h3>
            <button type="button" class="modal-close" id="closeAddBtn" aria-label="Close">&times;</button>
        </div>
        <div id="addAlert" class="alert" style="margin-top:0;"></div>
        <form id="addForm" novalidate>
            <div class="field">
                <label for="addName">Name</label>
                <input type="text" id="addName" required maxlength="100">
            </div>
            <div class="field">
                <label for="addPassword">Password</label>
                <input type="password" id="addPassword" required maxlength="100">
            </div>
            <div class="field">
                <label for="addEmail">Email</label>
                <input type="email" id="addEmail" maxlength="255">
            </div>
            <div class="field">
                <label for="addAge">Age</label>
                <input type="number" id="addAge" min="0" max="200">
            </div>
            <div class="field">
                <label for="addStatus">Status</label>
                <select id="addStatus">
                    <option value="NORMAL">NORMAL</option>
                    <option value="INIT">INIT</option>
                    <option value="ABNORMAL">ABNORMAL</option>
                </select>
            </div>
            <div class="field">
                <label for="addInterests">Interests</label>
                <input type="text" id="addInterests" placeholder="e.g. Pop, Jazz">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelAddBtn">Cancel</button>
                <button type="submit" id="submitAddBtn">Create user</button>
            </div>
        </form>
    </div>
</div>

<script>
    const PAGE_SIZE = 5;
    const tabs = document.querySelectorAll('.tab');
    const queryInput = document.getElementById('query');
    const searchForm = document.getElementById('searchForm');
    const searchBtn = document.getElementById('searchBtn');
    const alertBox = document.getElementById('alert');
    const listBox = document.getElementById('list');
    const pagerBox = document.getElementById('pager');
    const pagerInfo = document.getElementById('pagerInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const welcome = document.getElementById('welcome');
    const logoutBtn = document.getElementById('logoutBtn');

    let currentPage = 1;
    let lastPageHadFullSize = true;
    // password is stored hashed; keep the loaded value so edits don't wipe it
    let editOriginalPassword = '';

    const params = new URLSearchParams(window.location.search);
    const username = params.get('name');
    if (username) {

            hideList();
            showAlert('Network error. Please try again.', 'error');
        }

    // PlayRecordController runs in the multi-stage-price service on port 8083.
    const PLAY_RECORD_BASE = 'http://' + window.location.hostname + ':8083';
    const RECORD_PAGE_SIZE = 5;
    const recordsModal = document.getElementById('recordsModal');
    const recordsTitle = document.getElementById('recordsTitle');

    let recordsHadFullPage = false;

    function showRecordsAlert(message, type) {
        recordsAlert.textContent = message;
        recordsAlert.className = 'alert ' + type;
        recordsAlert.style.display = 'block';
    }

    // Pad a number to 2 digits.
    function pad2(n) { return String(n).padStart(2, '0'); }

    // Format a Date for a datetime-local input value: "YYYY-MM-DDTHH:mm:ss".
    function toLocalInputValue(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
            + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    // Convert a datetime-local input value to the backend pattern "yyyy-MM-dd HH:mm:ss".
    // Falls back to the supplied default when the field is empty.
    function toBackendTime(value, fallback) {
        const v = (value || '').trim();
        if (!v) return fallback;
        const withSeconds = v.length === 16 ? v + ':00' : v; // add seconds if omitted
        return withSeconds.replace('T', ' ');
    }

    function formatDateTime(value) {
        if (!value) return '—';
        const d = new Date(value);
        if (isNaN(d.getTime())) return value;
        return d.toLocaleString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function renderRecords(records) {
        recordsList.innerHTML = '';
        if (!records || records.length === 0) {
            recordsList.innerHTML = '<div class="empty">No play records for this user.</div>';
            return;
        }
        records.forEach(r => {
            const item = document.createElement('div');
            item.className = 'record-item';

            const title = document.createElement('div');
            title.className = 'record-title';
            const soundLabel = r.soundName ? r.soundName : ('Sound #' + r.soundId);
            title.textContent = soundLabel + ' · ' + (r.duration || 0) + 's';
            item.appendChild(title);

            const meta = document.createElement('div');
            meta.className = 'record-meta';
            meta.innerHTML =
                '<div>Record ID: ' + r.id + '</div>' +
                '<div>Synced: ' + formatDateTime(r.syncTime) + '</div>' +
                '<div>Created: ' + formatDateTime(r.createTime) + '</div>' +
                '<div>Updated: ' + formatDateTime(r.updateTime) + '</div>';
            item.appendChild(meta);

            recordsList.appendChild(item);
        });
    }

    function closeRecordsModal() {
        recordsModal.classList.remove('open');
    }

    // Load one page of the current user's records using the selected time window.
    async function loadRecords() {
        if (recordsUserId == null) return;
        recordsAlert.style.display = 'none';
        recordsList.innerHTML = '<div class="empty">Loading…</div>';
        recordsPager.style.display = 'none';

        // Backend requires a time window; empty fields fall back to a wide range.
        const startTime = toBackendTime(recordsStartInput.value, '2000-01-01 00:00:00');
        const endTime = toBackendTime(recordsEndInput.value, '2999-12-31 00:00:00');
        const pageStart = (recordsPage - 1) * RECORD_PAGE_SIZE;

        const url = PLAY_RECORD_BASE + '/play-record/query'
            + '?userId=' + encodeURIComponent(recordsUserId)
            + '&startTime=' + encodeURIComponent(startTime)
            + '&endTime=' + encodeURIComponent(endTime)
            + '&pageStart=' + pageStart
            + '&pageSize=' + RECORD_PAGE_SIZE;

        try {
            const res = await fetch(url, { method: 'GET' });
            const data = await res.json();
            if (data.baseVO && data.baseVO.code === 200 && data.baseVO.success) {
                const items = data.playRecordVOList || [];
                recordsHadFullPage = items.length === RECORD_PAGE_SIZE;
                renderRecords(items);
                recordsPager.style.display = 'flex';
                recordsPagerInfo.textContent = 'Page ' + recordsPage;
                recordsPrevBtn.disabled = recordsPage === 1;
                recordsNextBtn.disabled = !recordsHadFullPage;
            } else {
                recordsList.innerHTML = '';
                showRecordsAlert((data.baseVO && data.baseVO.message) || 'Failed to load play records.', 'error');
            }
        } catch (err) {
            recordsList.innerHTML = '';
            showRecordsAlert('Could not reach the play-record service (port 8083). Is it running?', 'error');
        }
    }

    // Highlight the active preset (or clear all when the user edits times manually).
    function setActivePreset(range) {
        recordsPresets.querySelectorAll('.range-preset').forEach(btn => {
            btn.classList.toggle('active', range != null && btn.dataset.range === range);
        });
    }

    // Compute [start, end] Dates for a named quick range.
    function rangeForPreset(range) {
        const now = new Date();
        const end = now;
        let start;
        if (range === 'today') {
            start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        } else if (range === '7d') {
            start = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        } else if (range === '30d') {
            start = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
        } else { // 'all'
            start = new Date(2000, 0, 1, 0, 0, 0);
        }
        return [start, end];
    }

    function applyPreset(range) {
        const [start, end] = rangeForPreset(range);
        recordsStartInput.value = toLocalInputValue(start);
        recordsEndInput.value = toLocalInputValue(end);
        setActivePreset(range);
        recordsPage = 1;
        loadRecords();
    }

    recordsPresets.addEventListener('click', (e) => {
        const btn = e.target.closest('.range-preset');
        if (btn) applyPreset(btn.dataset.range);
    });

    // Manual edits break the "preset" association.
    recordsStartInput.addEventListener('input', () => setActivePreset(null));
    recordsEndInput.addEventListener('input', () => setActivePreset(null));

    recordsApplyBtn.addEventListener('click', () => {
        recordsPage = 1;
        loadRecords();
    });
    recordsPrevBtn.addEventListener('click', () => {
        if (recordsPage > 1) {
            recordsPage--;
            loadRecords();
        }
    });
    recordsNextBtn.addEventListener('click', () => {
        if (recordsHadFullPage) {
            recordsPage++;
            loadRecords();
        }
    });

    closeRecordsBtn.addEventListener('click', closeRecordsModal);
    cancelRecordsBtn.addEventListener('click', closeRecordsModal);
    recordsModal.addEventListener('click', (e) => {
        if (e.target === recordsModal) closeRecordsModal();
    });

    function openRecordsModal(user) {
        if (user.id == null) {
            showAlert('Cannot load records: missing user ID.', 'error');
            return;
        }
        recordsUserId = user.id;
        recordsUserLabel = user.name || '#' + user.id;
        recordsPage = 1;
        recordsHadFullPage = false;
        recordsTitle.textContent = 'Play records — ' + recordsUserLabel;
        recordsAlert.style.display = 'none';

        // Default to the "Last 30 days" preset (editable by the user).
        const [defStart, defEnd] = rangeForPreset('30d');
        recordsStartInput.value = toLocalInputValue(defStart);
        recordsEndInput.value = toLocalInputValue(defEnd);
        setActivePreset('30d');

        recordsModal.classList.add('open');
        loadRecords();
    }

    async function openUserById(id) {
        try {
            const res = await fetch('/user/id?id=' + encodeURIComponent(id), { method: 'GET' });
            const data = await res.json();
            if (data.baseVO && data.baseVO.code === 200 && data.baseVO.success && data.userVO) {
                renderResult(data.userVO);
            } else {
                showAlert((data.baseVO && data.baseVO.message) || 'User not found.', 'error');
            }
        } catch (err) {
            showAlert('Network error while loading user.', 'error');
        }
    }

    loadPage();

    // Auto-open a user's detail when arriving from another page (e.g. music likers).
    const viewUserId = params.get('viewUserId');
    if (viewUserId) {
        openUserById(viewUserId);
    }
</script>
</body>
</html>
