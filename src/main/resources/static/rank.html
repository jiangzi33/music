<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Music</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            margin-bottom: 24px;
        }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header .user { font-size: 14px; opacity: 0.9; }
        .header .user a {
            color: #fff;
            margin-left: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 32px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h2 { font-size: 18px; color: #2d3748; }
        .control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4a5568;
        }
        .control select {
            padding: 7px 10px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #f7fafc;
        }
        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        .alert.error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        .rank-list { margin-top: 4px; }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            transition: background 0.15s;
        }
        .rank-item:hover { background: #f7fafc; }
        .rank-num {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #edf2f7;
            color: #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .rank-num.gold   { background: linear-gradient(135deg, #f6e05e 0%, #d69e2e 100%); color: #fff; }
        .rank-num.silver { background: linear-gradient(135deg, #cbd5e0 0%, #a0aec0 100%); color: #fff; }
        .rank-num.bronze { background: linear-gradient(135deg, #fbd38d 0%, #c05621 100%); color: #fff; }
        .rank-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #edf2f7 center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .rank-body { flex: 1; min-width: 0; }
        .rank-title {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-meta {
            font-size: 12px;
            color: #718096;
            margin-top: 2px;
        }
        .empty {
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
            padding: 24px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Leaderboard</h1>
        <div class="user">
            <span id="welcome"></span>
            <a id="backBtn">Back to search</a>
            <a id="logoutBtn">Sign out</a>
        </div>
    </div>

    <div class="card">
        <div class="toolbar">
            <h2>Top tracks</h2>
            <div class="control">
                <label for="topN">Show top</label>
                <select id="topN">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>

        <div id="alert" class="alert"></div>
        <div id="list" class="rank-list"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('name');
    const welcome = document.getElementById('welcome');
    if (username) welcome.textContent = 'Signed in as ' + username;

    const backBtn = document.getElementById('backBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    backBtn.addEventListener('click', () => {
        window.location.href = '/music.html' + (username ? '?name=' + encodeURIComponent(username) : '');
    });
    logoutBtn.addEventListener('click', () => {
        window.location.href = '/login.html';
    });

    const topNSelect = document.getElementById('topN');
    const listBox = document.getElementById('list');
    const alertBox = document.getElementById('alert');

    function showAlert(message) {
        alertBox.textContent = message;
        alertBox.className = 'alert error';
        alertBox.style.display = 'block';
    }

    function rankClass(idx) {
        if (idx === 0) return 'gold';
        if (idx === 1) return 'silver';
        if (idx === 2) return 'bronze';
        return '';
    }

    function render(items) {
        listBox.innerHTML = '';
        if (!items || items.length === 0) {
            listBox.innerHTML = '<div class="empty">No ranked tracks yet.</div>';
            return;
        }
        items.forEach((m, idx) => {
            const item = document.createElement('div');
            item.className = 'rank-item';

            const num = document.createElement('div');
            num.className = 'rank-num ' + rankClass(idx);
            num.textContent = (idx + 1);

            const thumb = document.createElement('div');
            thumb.className = 'rank-thumb';
            if (m.pictureUrl) {
                thumb.style.backgroundImage = "url('" + m.pictureUrl.replace(/'/g, "\\'") + "')";
            } else {
                thumb.textContent = (m.title || '?').charAt(0).toUpperCase();
            }

            const body = document.createElement('div');
            body.className = 'rank-body';
            const title = document.createElement('div');
            title.className = 'rank-title';
            title.textContent = m.title || 'Untitled';
            const meta = document.createElement('div');
            meta.className = 'rank-meta';
            const parts = [];
            if (m.author) parts.push('by ' + m.author);
            if (m.id != null) parts.push('#' + m.id);
            meta.textContent = parts.join(' · ');
            body.appendChild(title);
            body.appendChild(meta);

            item.appendChild(num);
            item.appendChild(thumb);
            item.appendChild(body);
            listBox.appendChild(item);
        });
    }

    async function load() {
        alertBox.style.display = 'none';
        listBox.innerHTML = '<div class="empty">Loading...</div>';
        const n = parseInt(topNSelect.value, 10);
        try {
            const res = await fetch('/music-rank/topN?n=' + n, { method: 'GET' });
            const data = await res.json();
            if (data.baseVO && data.baseVO.code === 200 && data.baseVO.success) {
                render(data.musicVOList || []);
            } else {
                listBox.innerHTML = '';
                showAlert((data.baseVO && data.baseVO.message) || 'Failed to load leaderboard.');
            }
        } catch (err) {
            listBox.innerHTML = '';
            showAlert('Network error. Please try again.');
        }
    }

    topNSelect.addEventListener('change', load);
    load();
</script>
</body>
</html>
